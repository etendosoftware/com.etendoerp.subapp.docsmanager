group          = "com.etendoerp"
version        = "3.0.0"
description    = "A sub-application for Etendo Mobile that facilitates document management and sharing through React Native Share Intent."
ext.artifact   = "subapp.docsmanager"
ext.repository = "https://repo.futit.cloud/repository/maven-snapshots"

configurations {
    moduleDependencyContainer
}

publishing {
    publications {
        "com.etendoerp.subapp.docsmanager"(MavenPublication) {
            from components.java
            groupId    = group
            artifactId = artifact
            version    = version
        }
    }
    repositories {
        maven {
            url "https://repo.futit.cloud/repository/maven-snapshots"
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://repo.futit.cloud/repository/maven-snapshots"
    }
}

/**
* Declare Java dependencies using 'implementation'
